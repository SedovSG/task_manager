[project]
name = "task-manager"
version = "0.1.0"
description = "CLI менеджер задач на Python"
readme = "README.md"
authors = [
    { name = "Станислав Седов", email = "sedovsg@ya.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
task-manager = "task_manager.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
