<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link rel="stylesheet" href="/static/css/app.css">
        <script src="/static/js/app.js" defer></script>
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">

                    <!-- Заголовок -->
                    <h1 class="text-center text-white mb-4">
                        <i class="bi bi-check2-square"></i> Task Manager
                    </h1>

                    <!-- Форма добавления задачи -->
                    <div class="app-card">
                        <h5 class="mb-3"><i class="bi bi-plus-circle"></i> Новая задача</h5>
                        <form id="add-form">
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <input
                                        type="text"
                                        id="task-title"
                                        class="form-control"
                                        placeholder="Название задачи..."
                                        required
                                    />
                                </div>
                                <div class="col-md-3">
                                    <select id="task-priority" class="form-select text-black">
                                        <option value="LOW">🟢 LOW</option>
                                        <option value="MEDIUM" selected>🟡 MEDIUM</option>
                                        <option value="HIGH">🔴 HIGH</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="bi bi-plus-lg"></i> Добавить
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div id="add-message" class="mt-2"></div>
                    </div>

                    <!-- Список задач -->
                    <div class="app-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0"><i class="bi bi-list-task"></i> Мои задачи</h5>
                            <span id="task-count" class="badge bg-secondary">0</span>
                        </div>
                        <div id="task-list">
                            <div class="text-center text-muted py-4">Загрузка...</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
